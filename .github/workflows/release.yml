# On every push to main: semantic-release reads the conventional commits since
# the last tag (feat → minor, fix/perf/refactor/build → patch). If there is a
# release, it tags vX.Y.Z, creates the GitHub release, and builds + pushes
# harbor.floret.dev/boson/pushrelay:<version> and :latest (linux/amd64 + linux/arm64).
#
# Secrets: HARBOR_USERNAME / HARBOR_PASSWORD with push rights to the Harbor
# `boson` project (public, so anyone can pull).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  IMAGE: harbor.floret.dev/boson/pushrelay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pushrelay
          POSTGRES_PASSWORD: pushrelay-ci
          POSTGRES_DB: pushrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pushrelay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://pushrelay:pushrelay-ci@localhost:5432/pushrelay?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.floret.dev
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release
